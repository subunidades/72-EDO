<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>72-EDO Explorer</title>
<style>
:root{--bg:#f3f1f7;--fg:#1d1a2b;--mut:#6b6780;--card:#fff;--line:#d9d5e6;
--r0:#6c6a7c;--r1:#d6453d;--r2:#e08a1e;--r3:#c9b21a;--r4:#2f9e6e;--r5:#2a77c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--fg:#ece9f7;--mut:#9a96b0;--card:#1f1c2e;--line:#35314b;--r0:#a09db4;--r1:#ef6b62;--r2:#f0a43f;--r3:#e3cf4a;--r4:#4cc794;--r5:#5aa2f0}}
:root[data-theme="dark"]{--bg:#15131f;--fg:#ece9f7;--mut:#9a96b0;--card:#1f1c2e;--line:#35314b;--r0:#a09db4;--r1:#ef6b62;--r2:#f0a43f;--r3:#e3cf4a;--r4:#4cc794;--r5:#5aa2f0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:980px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:2rem;font-weight:600;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
svg{width:100%;height:auto;display:block}
.dot{cursor:pointer;outline:none}.dot:focus-visible{stroke:var(--fg);stroke-width:3}
.big{font-size:3rem;font-weight:600;line-height:1}.big small{font-size:1.1rem;color:var(--mut);font-weight:400}
.meta{color:var(--mut);margin:6px 0 12px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--fg)}button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{font-weight:400;color:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:.9rem;margin-top:8px}
h2{font-size:1.05rem;margin:16px 0 4px;font-weight:600}
</style>
</head>
<body>
<main>
<h1>72-EDO explorer</h1>
<p class="sub">Twelve-tone equal temperament, each semitone split in six. Tap a dot to hear that step, see its size in cents and which just ratios it stands in for.</p>
<div class="grid">
<div class="card">
<svg id="wheel" viewBox="0 0 360 360" role="group" aria-label="72 steps of the octave"></svg>
<div class="leg" id="leg"></div>
</div>
<div class="card" id="panel">
<div class="big" id="step"></div>
<div class="meta" id="meta"></div>
<h2>Just ratios it approximates</h2>
<table><thead><tr><th>Ratio</th><th>Just (¢)</th><th>Error</th><th>Hear it</th></tr></thead><tbody id="rat"></tbody></table>
<h2>Play</h2>
<div class="row" id="chords"></div>
<div class="row"><button id="harm">Harmonics 8–16</button><button id="sweep">All 72 steps</button><button id="stop">Stop</button><button id="beep">Test beep (440 Hz)</button></div>
<div class="meta" id="status">Click a dot or the test beep to start audio.</div>
</div>
</div>
</main>
<script>
const R=["1/1","81/80 91/90 99/98","49/48 64/63","33/32 36/35","25/24 28/27","20/19 21/20","17/16 18/17","15/14 16/15","13/12 14/13","12/11","11/10","10/9","9/8","17/15","8/7","15/13","7/6","13/11","32/27 19/16","6/5","17/14 39/32","11/9","16/13","5/4","24/19","14/11","9/7","13/10","17/13 21/16","33/25","4/3","27/20","15/11","11/8","18/13","7/5","17/12","10/7","13/9","16/11","19/13","40/27","3/2","50/33","26/17 32/21","17/11 20/13","14/9","11/7","19/12","8/5","13/8","18/11","28/17","5/3","27/16","17/10","12/7","19/11","7/4","30/17","16/9","9/5","20/11","11/6","13/7","15/8","17/9","19/10","25/13","35/18","49/25","99/50","2/1"].map(s=>s.split(" "));
const RING=["plain","up","dup","trup","dud","down"],COL=i=>`var(--r${i})`;
const NOTE=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const base=261.63,hz=s=>base*Math.pow(2,s/72),cents=r=>{const[a,b]=r.split("/").map(Number);return 1200*Math.log2(a/b)};
let sel=0,ctx=null,timers=[];
let live=[];
const status=m=>{const e=document.getElementById("status");if(e)e.textContent=m};
const A=()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=="running")ctx.resume();return ctx};
function tone(f,t=0,d=1.1,g=.3){try{const c=A(),o=c.createOscillator(),v=c.createGain(),s=c.currentTime+.03+t;
o.type="triangle";o.frequency.value=f;v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(g,s+.02);
v.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(v);v.connect(c.destination);o.start(s);o.stop(s+d+.05);
live.push(o);o.onended=()=>{live=live.filter(x=>x!==o)};status("Audio "+c.state+" · "+f.toFixed(1)+" Hz")}
catch(e){status("Audio error: "+e.message)}}
function stop(){live.forEach(o=>{try{o.stop()}catch(e){}});live=[]}
const play=(arr,gap=.45,d=1)=>arr.forEach((s,i)=>tone(hz(s),i*gap,d));
const chord=a=>a.forEach(s=>tone(hz(s),0,2,.2));
function name(s){const k=Math.round(s/6),o=s-k*6;const n=NOTE[k%12];
return o===0?n:n+" "+(o>0?"+":"−")+Math.abs(o)+" moria"}
function select(s,snd=true){sel=s;document.querySelectorAll(".dot").forEach(d=>d.setAttribute("stroke",+d.dataset.s===s?"var(--fg)":"none"));
document.getElementById("step").innerHTML=s+"<small>\\72</small>";
const c=s*50/3;document.getElementById("meta").innerHTML=`<span class="pill" style="background:${COL(s%6)}"></span>${c.toFixed(1)}¢ · ${hz(s).toFixed(1)} Hz from C4 · nearest 12-EDO: ${name(s)} · ring: ${RING[s%6]}`;
document.getElementById("rat").innerHTML=R[s].map(r=>{const j=cents(r),e=c-j;return `<tr><td>${r}</td><td>${j.toFixed(1)}</td><td>${e>0?"+":""}${e.toFixed(1)}¢</td><td><button data-r="${r}">▶ 72-EDO, then just</button></td></tr>`}).join("");
if(snd)tone(hz(s))}
function build(){const w=document.getElementById("wheel");let h="";
for(let i=0;i<72;i++){const a=i/72*2*Math.PI-Math.PI/2,r=148,x=180+r*Math.cos(a),y=180+r*Math.sin(a),big=i%6===0;
h+=`<circle class="dot" data-s="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big?9:5.5}" fill="${COL(i%6)}" tabindex="0" role="button" aria-label="Step ${i}" stroke="none" stroke-width="3"/>`;
if(big){const lr=122;h+=`<text x="${(180+lr*Math.cos(a)).toFixed(1)}" y="${(180+lr*Math.sin(a)+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--mut)">${NOTE[i/6]}</text>`}}
h+=`<text x="180" y="176" text-anchor="middle" font-size="15" fill="var(--fg)">72 steps</text><text x="180" y="196" text-anchor="middle" font-size="12" fill="var(--mut)">16.67¢ each</text>`;
w.innerHTML=h;
w.addEventListener("click",e=>{const d=e.target.closest(".dot");if(d)select(+d.dataset.s)});
w.addEventListener("keydown",e=>{const d=e.target.closest(".dot");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(+d.dataset.s)}});
document.getElementById("leg").innerHTML=RING.map((n,i)=>`<span><span class="pill" style="background:${COL(i)}"></span>${n}</span>`).join("")}
const TR=[["zo 6:7:9",[0,16,42]],["gu 10:12:15",[0,19,42]],["ilo 18:22:27",[0,21,42]],["yo 4:5:6",[0,23,42]],["ru 14:18:27",[0,26,42]]];
document.getElementById("chords").innerHTML=TR.map((t,i)=>`<button data-c="${i}">${t[0]}</button>`).join("");
document.getElementById("chords").onclick=e=>{const b=e.target.closest("button");if(b){stop();chord(TR[+b.dataset.c][1].map(x=>x+sel))}};
document.getElementById("rat").onclick=e=>{const b=e.target.closest("button");if(!b)return;
const j=base*Math.pow(2,cents(b.dataset.r)/1200);stop();tone(hz(0),0,1.2);tone(hz(sel),0,1.2);tone(hz(0),1.4,1.2);tone(j,1.4,1.2)};
document.getElementById("harm").onclick=()=>{stop();play([0,12,23,33,42,50,58,65,72],.5,.9)};
document.getElementById("sweep").onclick=()=>{stop();play([...Array(73).keys()],.12,.4)};
document.getElementById("stop").onclick=stop;
document.getElementById("beep").onclick=()=>tone(440,0,1,.3);
build();select(0,false);
</script>
</body>
</html>
